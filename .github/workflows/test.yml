name: tests

# The decision module is written in boru, so CI has to build the
# `boru` interpreter from source before it can run anything. The
# language has no tagged release yet and has shipped breaking changes
# between commits, so we pin BORU_REF to the exact commit this module is
# verified against. Bump it (and re-run the suites locally) when
# adopting a newer aql.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out decision
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # The compiled binary only depends on BORU_REF (and the OS), so a
      # hit here lets us skip the clone + build entirely.
      - name: Resolve boru main HEAD
        id: boruref
        run: echo "sha=$(git ls-remote https://github.com/boru-lang/boru.git main | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache boru binary
        id: cache-boru
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/boru
          key: boru-${{ steps.boruref.outputs.sha }}-${{ runner.os }}

      - name: Check out boru source
        if: steps.cache-boru.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: boru-lang/boru
          ref: ${{ steps.boruref.outputs.sha }}
          path: boru-src

      # The documented `go install …/cmd/go/aql@latest` cannot work
      # while cmd/go/go.mod carries replace directives, so we build from
      # the clone with -mod=mod instead.
      - name: Build boru
        if: steps.cache-boru.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          cd boru-src/cmd/go
          GOWORK=off GOFLAGS=-mod=mod go build \
            -ldflags "-X github.com/boru-lang/boru/cmd/go.Version=${{ steps.boruref.outputs.sha }}" \
            -o "$HOME/.local/bin/boru" ./boru

      - name: Add boru to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report boru version
        run: boru -version

      # Each suite ends with `0 test.fail-count end assert.equal`, so a
      # failure makes boru exit non-zero and fails the step.
      - name: Unit tests (direct)
        run: boru test/decision_unit_test.aql

      - name: Unit tests (spec format)
        run: boru test/decision_unit_spec.aql

      - name: Property tests (direct)
        run: boru test/decision_prop_test.aql

      - name: Property tests (spec format)
        run: boru test/decision_prop_spec.aql

      - name: Smoke test
        run: boru test/decision_smoke_test.aql

      # Advisory static check — NOT a gate. `boru check` is a structural type
      # checker, but this library exports its words by reference (`cond/r`,
      # …) and dispatches dynamically, so the checker can't trace those exports
      # and reports false `unused_def`/`no_signature` diagnostics on code the
      # suites prove correct. We run it with `--soft` (always exits 0) and
      # `continue-on-error` so the diagnostics surface in the log for a human to
      # skim, without ever failing the build. The runnable suites above are the
      # real gate.
      - name: Static check (advisory, non-gating)
        continue-on-error: true
        run: boru check --soft decision.aql

  # Lightweight guard for the agent-skill packaging and the pinned-ref single
  # source of truth (no boru needed). The plugin must bundle its own copy of the
  # skill — plugins can't point at an external .claude/skills dir — so two
  # copies exist and can drift; and the boru commit is pinned in several files
  # that must agree.
  consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Check out decision
        uses: actions/checkout@v4

      - name: SKILL.md copies are in sync
        run: |
          canonical=.claude/skills/decision-aql/SKILL.md
          bundled=plugins/decision-aql/skills/decision-aql/SKILL.md
          if ! diff -u "$canonical" "$bundled"; then
            echo "::error file=$bundled::Plugin skill has drifted from $canonical"
            echo "Fix by copying the canonical skill over the bundled one:"
            echo "  cp $canonical $bundled"
            exit 1
          fi
          echo "SKILL.md copies are identical."

      - name: JSON manifests are valid
        run: |
          for j in .claude-plugin/marketplace.json \
                   plugins/decision-aql/.claude-plugin/plugin.json \
                   api.json; do
            if python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$j"; then
              echo "ok: $j"
            else
              echo "::error file=$j::invalid JSON"
              exit 1
            fi
          done
